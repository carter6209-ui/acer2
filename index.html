<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每月&ensp;季獎金&ensp;試算</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .img-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .img-container img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: white;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        .result-item {
            font-size: 15px;
            margin-bottom: 10px;
            color: #555;
            line-height: 1.6;
        }
        .highlight {
            font-size: 26px;
            color: red;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

    <div class="form-group">
        <label for="bonus_base_salary">底薪 (元)</label>
        <input type="number" id="bonus_base_salary" class="bonus-input" value="" min="0">
    </div>

    <div class="form-group">
        <label for="bonus_working_days">總上班天數 (天)</label>
        <input type="number" id="bonus_working_days" class="bonus-input" value="" min="0">
    </div>

    <div class="form-group">
        <label for="bonus_overtime_hours">總加班時數 (小時)</label>
        <input type="number" id="bonus_overtime_hours" class="bonus-input" value="" min="0">
    </div>

    <div class="form-group">
        <label for="bonus_performance">績效比例</label>
        <select id="bonus_performance" class="bonus-input">
            <option value="0.09">達標 9%</option>
            <option value="0.11">超標 11%</option>
            <option value="0.14">超超標 14%</option>
        </select>
    </div>

    <button id="calcBtn" onclick="calculateBonus()">計算季獎金</button>

    <div class="results" id="bonus_result_block" style="display:none;">
        <div class="result-item" id="bonus_details"></div>
        <div class="highlight" id="bonus_highlight_value"></div>
    </div>
</div>

<script>
// 綁定 Enter 鍵跳欄位事件
const inputs = document.querySelectorAll('.bonus-input');
inputs.forEach((input, index) => {
    input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); // 防止預設行為
            if (index < inputs.length - 1) {
                inputs[index + 1].focus();
            } else {
                calculateBonus();
            }
        }
    });
});

function calculateBonus() {
    const baseSalary = parseFloat(document.getElementById('bonus_base_salary').value) || 0;
    const workingDays = parseFloat(document.getElementById('bonus_working_days').value) || 0;
    const overtimeHours = parseFloat(document.getElementById('bonus_overtime_hours').value) || 0;
    const performanceRate = parseFloat(document.getElementById('bonus_performance').value) || 0;

    // 計算時薪 (精確值)
    const hourlyWage = baseSalary / 30 / 8;

    // 實數上班總時數
    const totalWorkingHours = (workingDays * 8) + overtimeHours;

    // 計算當月預估季獎金
    const monthlyBonus = Math.round(hourlyWage * totalWorkingHours * performanceRate);

    // 顯示詳細計算流程
    document.getElementById('bonus_details').innerHTML = `
        1. 底薪：${baseSalary.toLocaleString()} 元 (折合時薪約 ${hourlyWage.toFixed(2)} 元)<br>
        2. 總上班天數：${workingDays} 天 (一般工時：${workingDays * 8} 小時)<br>
        3. 總加班時數：${overtimeHours} 小時<br>
        &nbsp;&nbsp;&nbsp;- 實數上班總時數：${totalWorkingHours} 小時<br>
        4. 績效比例：${(performanceRate * 100).toFixed(0)}%
    `;

    // 顯示 26級紅字
    document.getElementById('bonus_highlight_value').innerText = `當月預估季獎金：${monthlyBonus.toLocaleString()} 元`;
    document.getElementById('bonus_result_block').style.display = 'block';
}
</script>
